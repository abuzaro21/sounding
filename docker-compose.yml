# Local PostgreSQL for development and tests. The app connects as a non-superuser role so row-level security applies.
services:
  db:
    image: postgres:16-alpine
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_PASSWORD: devonly
    volumes: ["./scripts/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
