# Render Blueprint: one free web service (Docker) and one free Postgres, in their own isolated workspace.
# Free Postgres expires 30 days after creation; record the date and the continuity plan in docs/DEPLOY.md.
services:
  - type: web
    name: sounding
    runtime: docker
    plan: free
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: SND_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sounding-db
          property: connectionString
databases:
  - name: sounding-db
    plan: free
    databaseName: sounding
    user: sounding
    ipAllowList: [] # internal connections only
